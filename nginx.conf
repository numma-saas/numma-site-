# Site NUMMA (numma.eu) servi par Nginx sur Scalingo (buildpack Nginx).
# Ce fichier est inséré par le buildpack dans le bloc « server » :
# ne pas y mettre listen, server_name, access_log ni error_log (consigne Scalingo).

root /app;
index index.html;
charset utf-8;

# Compression des fichiers texte
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

# En-têtes de sécurité (HSTS est ajouté par Scalingo avec « Force HTTPS »)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Pages : mêmes adresses qu'avant (tarifs.html, blog/...).
# /tarifs sans extension fonctionne aussi, comme sur GitHub Pages.
location / {
  try_files $uri $uri.html $uri/ =404;
}

# Fichiers internes du dépôt : jamais servis
location ~* ^/(CHANGELOG[^/]*\.md|PASSATION[^/]*|nginx\.conf|Procfile|CNAME|.*\.bak|css/style\.source\.css)$ {
  return 404;
}
location ~ /\. {
  return 404;
}

# Cache navigateur : polices et images longtemps, CSS et JS 1 heure
location ~* \.(woff2|jpg|jpeg|png|webp|gif|svg|ico)$ {
  expires 30d;
  try_files $uri =404;
}
location ~* \.(css|js)$ {
  expires 1h;
  try_files $uri =404;
}
